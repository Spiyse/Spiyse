<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230">
  <style>
    .t { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .big { font-size: 46px; font-weight: 700; fill: #e6edf3; }
    .sub { font-size: 18px; fill: #8b949e; }
    .acc { fill: #c4b5fd; }
    .cur { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .bob { animation: bob 2.4s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  </style>

  <rect x="1" y="1" width="998" height="228" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <!-- faint heatmap strip, nods to the activity graph below -->
  <g opacity="0.35">
    <rect x="40" y="196" width="10" height="10" rx="2" fill="#2e2a45"/>
    <rect x="54" y="196" width="10" height="10" rx="2" fill="#4c4380"/>
    <rect x="68" y="196" width="10" height="10" rx="2" fill="#7c6fc4"/>
    <rect x="82" y="196" width="10" height="10" rx="2" fill="#2e2a45"/>
    <rect x="96" y="196" width="10" height="10" rx="2" fill="#c4b5fd"/>
    <rect x="110" y="196" width="10" height="10" rx="2" fill="#4c4380"/>
    <rect x="124" y="196" width="10" height="10" rx="2" fill="#161b22"/>
    <rect x="138" y="196" width="10" height="10" rx="2" fill="#7c6fc4"/>
    <rect x="152" y="196" width="10" height="10" rx="2" fill="#2e2a45"/>
    <rect x="166" y="196" width="10" height="10" rx="2" fill="#c4b5fd"/>
  </g>

  <g class="t">
    <text x="40" y="62" class="sub"><tspan class="acc">~/spiyse</tspan> $ whoami</text>
    <text x="40" y="120" class="big">hey, i'm spiyse<tspan class="acc cur">_</tspan></text>
    <text x="40" y="158" class="sub">i make websites, small games and whatever i get curious about.</text>
  </g>

  <!-- pixel goose in a top hat -->
  <g transform="translate(790 26)"><g class="bob">
    <g transform="scale(6)" shape-rendering="crispEdges">
      <rect x="7" y="0" width="6" height="5" fill="#ffffff"/>
      <rect x="8" y="1" width="4" height="3" fill="#0d1117"/>
      <rect x="8" y="3" width="4" height="1" fill="#8b7fd4"/>
      <rect x="5" y="5" width="10" height="1" fill="#ffffff"/>
      <rect x="8" y="6" width="5" height="4" fill="#ffffff"/>
      <rect x="11" y="7" width="1" height="1" fill="#0d1117"/>
      <rect x="13" y="8" width="3" height="1" fill="#e3b341"/>
      <rect x="13" y="9" width="2" height="1" fill="#e3b341"/>
      <rect x="8" y="10" width="3" height="5" fill="#ffffff"/>
      <rect x="6" y="11" width="2" height="3" fill="#8b7fd4"/>
      <rect x="11" y="11" width="2" height="3" fill="#8b7fd4"/>
      <rect x="8" y="12" width="3" height="1" fill="#8b7fd4"/>
      <rect x="1" y="14" width="2" height="3" fill="#ffffff"/>
      <rect x="3" y="15" width="11" height="6" fill="#ffffff"/>
      <rect x="13" y="16" width="1" height="4" fill="#ffffff"/>
      <rect x="5" y="16" width="6" height="3" fill="#8b949e"/>
      <rect x="7" y="21" width="1" height="4" fill="#e3b341"/>
      <rect x="10" y="21" width="1" height="4" fill="#e3b341"/>
      <rect x="6" y="25" width="3" height="1" fill="#e3b341"/>
      <rect x="9" y="25" width="3" height="1" fill="#e3b341"/>
    </g>
  </g></g>
</svg>
